services:

  # ─────────────────────────────────────────────
  # Container A — WPA2 Access Point
  # Uses wlan0 (created by mac80211_hwsim)
  # Loads the kernel module for all containers
  # ─────────────────────────────────────────────
  ap:
    build: ./ap
    container_name: wep-ap
    privileged: true          # Needs modprobe + raw netlink
    network_mode: host        # Shares host netns — wlan* ifaces are on the host
    volumes:
      - /lib/modules:/lib/modules:ro  # So modprobe can find mac80211_hwsim
    restart: on-failure

  # ─────────────────────────────────────────────
  # Container B — WPA2 Client
  # Uses wlan1 (second radio from mac80211_hwsim)
  # Must start AFTER ap so the module is already loaded
  # ─────────────────────────────────────────────
  client:
    build: ./client
    container_name: wep-client
    privileged: true
    network_mode: host        # Same netns — sees wlan1
    volumes:
      - /lib/modules:/lib/modules:ro
    depends_on:
      - ap
    restart: on-failure

