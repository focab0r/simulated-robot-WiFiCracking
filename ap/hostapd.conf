# Interface — wlan0 will be the AP radio
interface=wlan0
driver=nl80211

# SSID
ssid=wifi-old

# Channel and band
hw_mode=g
channel=6

# WEP — auth_algs=1 = Open System, 3 = Open+Shared
# Using Open System (1): lets aircrack-ng inject/crack more easily (realistic)
auth_algs=1

# WEP key (40-bit = 10 hex chars, or 5 ASCII chars)
wep_default_key=0
wep_key0=AABBCCDDEE

# No WPA at all
wpa=0

# Needed for mac80211_hwsim
ieee80211n=0
wmm_enabled=0

# Logging
logger_stdout=-1
logger_stdout_level=2
